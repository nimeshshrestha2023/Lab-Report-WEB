<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style: none;
            background-color: black;
            color: white;
        }

        li{
            display: inline-block;
            padding: 10px;
        }
        ul li:hover{
            background-color: slateblue;
            color: white;
        }

        .dropdown{display: none;}
        ul li:hover .dropdown{
            display: block;
            position: absolute;
            margin-left: -10px;
            margin-top: 10px;
        }

        .dropdown ul li{
            display: block;
        }

        .dropdown-mern{
            position: absolute;
            margin-left: 4.2cm;
            margin-top: -0.8cm;
        }
    </style>
</head>
<body>

    <ul>
        <li>Home</li>
        <li>Services</li>
        <li>Courses
            <div class="dropdown">
                <ul>
                    <li>MERN Stack
                        <div class="dropdown-mern">
                            <ul>
                                <li>Full Time</li>
                                <li>Part time</li>
                            </ul>
                        </div>
                    </li>
                    <li>CyberSecurity Defence</li>
                    <li>QA</li>
                    <li>Graphic Designing</li>
                </ul>
            </div>
        </li>
        <li>Contact</li>
    </ul>
</body>
</html>
