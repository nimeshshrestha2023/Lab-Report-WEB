<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* General Reset */
        body {
            margin: 0;
            padding: 50px;
            background: linear-gradient(135deg, #70287f, #4a1d64);
            /* Matching your background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Main Navbar Container */
        .navbar {
            background-color: #f0f0f0;
            border-radius: 8px;
            padding: 0 20px;
            display: inline-block;
            /* Fits to content width like the image */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .nav-links {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        .nav-links>li {
            position: relative;
            /* Anchor for the dropdown */
        }

        .nav-links>li>a {
            display: block;
            padding: 20px 25px;
            text-decoration: none;
            color: #000;
            font-weight: 500;
        }

        /* Dropdown Menu (Hidden by default) */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            /* Sits right below the nav bar */
            left: 0;
            background-color: #f0f0f0;
            min-width: 200px;
            list-style: none;
            padding: 10px 0;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        /* Show dropdown on hover */
        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .dropdown-menu li a {
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            color: #000;
        }

        /* Highlight "Development" like in your image */
        .dropdown-menu li a:hover,
        .dropdown-menu li:nth-child(2) a {
            background-color: #ffffff;
        }

        /* Simple Arrows using CSS Borders */
        .arrow {
            border: solid black;
            border-width: 0 2px 2px 0;
            display: inline-block;
            padding: 3px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .down {
            transform: rotate(45deg);
        }

        .up {
            transform: rotate(-135deg);
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li class="dropdown">
                <a href="#">Services <span class="arrow up"></span></a>
                <ul class="dropdown-menu">
                    <li><a href="#">Design</a></li>
                    <li><a href="#">Development</a></li>
                    <li><a href="#">Accessibility</a></li>
                    <li><a href="#">Content Strategy</a></li>
                    <li><a href="#">Training</a></li>
                </ul>
            </li>
            <li class="dropdown">
                <a href="#">Portfolio <span class="arrow down"></span></a>
            </li>
            <li class="dropdown">
                <a href="#">About <span class="arrow down"></span></a>
            </li>
        </ul>
    </nav>

</body>

</html>
