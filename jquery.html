<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            max-width: 500px;
            width: 100%;
            border: 1px solid black;
            border-radius: 8px;
            margin: 10px auto;
            box-shadow: 0 0 10px #adadad;
            padding: 10px;
            background-color: #f5f5f5;
        }

        .form-layout {
            margin-bottom: 10px;
        }

        .form-layout label {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: block;
            margin-bottom: 10px;
        }

        .form-layout input {
            width: 100%;
            padding: 10px 0;
            border: 2px solid #adadad;
            border-radius: 8px;
        }

        .heading {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2 class="heading">Register</h2>
        <form action="" onsubmit="return validateForm()">
            <div class="form-layout">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter name">
                <span id="name-error" class="input-error"></span>
            </div>

            <div class="form-layout">
                <label for="email">Email</label>
                <input type="email" id="email">
                <span id="email-error" class="input-error"></span>
            </div>

            <div class="form-layout">
                <label for="password">Password</label>
                <input type="password" id="password">
                <span id="password-error" class="input-error"></span>
            </div>

            <div class="form-layout">
                <label for="cpassword">Confirm Password</label>
                <input type="password" id="cpassword">
                <span id="cpassword-error" class="input-error"></span>
            </div>

            <div class="form-layout">
                <input type="submit" value="Register">
            </div>
        </form>
    </div>

    <script>
        function validateForm() {
            let countError = 0;
            let nameBox = document.getElementById("username");
            let emailBox = document.getElementById("email");
            let passBox = document.getElementById("password");
            let cpassBox = document.getElementById("cpassword");

            document.querySelectorAll('.input-error').forEach(span => span.innerHTML = "");

            let nameCheck = /^[a-zA-Z ]{3,}$/;
            let passwordCheck = /^(?=.*[0-9](?=.*[!@#$%^&*])[a-zA-Z!@#$%^&*]{6,16})$/;
            let emailCheck = /^[a-zA-Z0-9_]@[a-zA-Z]{6,}[.]{1}[a-zA-Z]{2,8}$/;

            let isValid = true;

            // 4. Validation Logic
            if (!nameCheck.test(nameBox.value)) {
                document.getElementById("name-error").innerHTML = "Name must be at least 3 alphabetic characters.";
                document.getElementById("name-error").style.color = "red";
                isValid = false;
            }

            if (!emailCheck.test(emailBox.value)) {
                document.getElementById("email-error").innerHTML = "Please enter a valid email address.";
                document.getElementById("email-error").style.color = "red";
                isValid = false;
            }

            if (!passwordCheck.test(passBox.value)) {
                document.getElementById("password-error").innerHTML = "Password needs 6-16 chars, 1 number, and 1 special char.";
                document.getElementById("password-error").style.color = "red";
                isValid = false;
            }

            if (passBox.value !== cpassBox.value || cpassBox.value === "") {
                document.getElementById("cpassword-error").innerHTML = "Passwords do not match.";
                document.getElementById("cpassword-error").style.color = "red";
                isValid = false;
            }

            return isValid; // Form only submits if isValid is true
        }
    </script>


</body>

</html>
